<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Dashboard</title>
    <link rel="stylesheet" href="surv-land.css">
    <style>
        body{
            margin-top: 80px;
            padding: 30px;
            box-sizing: border-box;
        }
        .dashboard-container{
            max-width: var(--maxw);
            margin: 0 auto;
        }
        .inner-card{
            background-color: var(--bg-elevated);
            padding: 20px;
            margin-top: 40px;
            border: 1px solid var(--border);
            color: var(--white);
        }
        .inner-card h3{
            color: var(--white);
        }
        .inner-card p{
            color: var(--muted);
        }
        .share-row{
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .share-row code{
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--white);
            background: var(--bg-card);
            padding: 6px 10px;
            border: 1px solid var(--border);
            word-break: break-all;
        }
        .copy-btn{
            background: transparent;
            border: 1px solid var(--white);
            color: var(--white);
            padding: 6px 14px;
            font-size: 0.85rem;
            cursor: pointer;
            font-family: var(--font-body);
            transition: background .3s, color .3s;
        }
        .copy-btn:hover{
            background: var(--white);
            color: var(--bg);
        }
        .copy-icon-btn{
            background: transparent;
            border: 1px solid var(--border);
            color: var(--white);
            width: 34px;
            height: 34px;
            flex-shrink: 0;
            cursor: pointer;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: border-color .3s, background .3s;
        }
        .copy-icon-btn:hover{
            border-color: var(--white);
            background: var(--bg-card);
        }
        .nav-inner{
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
        }
        .nav-email{
            justify-self: center;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--muted);
        }
        .nav-actions{
            justify-self: end;
        }
        .dashboard-actions{
            margin-top: 20px;
        }
    </style>
</head>

<header class="nav">
  <div class="nav-inner">
    <div class="logo">Hexa<span class="x">Survey</span></div>
    <div class="nav-email" id="navEmail"></div>
    <div class="nav-actions">
      <button id="themeToggle" class="theme-toggle-btn" aria-label="Toggle theme">
        <i class="fa-solid fa-sun" id="themeIcon"></i>
      </button>
      <a href="#" id="signOutBtn" class="sign-in nav-cta" style="display: block;">Sign out</a>
    </div>
  </div>
</header>

<body>
    <section class="dashboard">
        <div class="dashboard-container">
            <h1 class="headline" style="text-align: center;">Dashboard</h1><br>
             <p style="text-align: center;">Here you can manage your surveys and view analytics.</p>
            <section class="inner-card" id="latestShare" hidden></section>
            <section class="inner-card" id="creatorSurveysCard">
                <h2>My Surveys</h2><br>
                <div id="surveyList">
                    <p>Loading your surveys…</p>
                </div><br><br>
            <div class="dashboard-actions">
                <button class="btn btn-primary"><a href="create-survey.html">+ Create a Survey</a></button>
               <!-- <button class="btn btn-secondary"><a href="view-surveys.html">View Surveys</a></button> -->
            </div>
            </section>

            <section class="inner-card" id="respondentJoinCard" hidden>
                <h2>Join a Survey</h2><br>
                <p>Paste the survey link or code someone shared with you.</p>
                <div style="display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;">
                    <input type="text" id="joinSurveyInput" placeholder="e.g. share.html?token=ABCD1234 or just ABCD1234"
                        style="flex:1; min-width:220px; background:transparent; border:1px solid var(--border); color:var(--white); padding:14px; font-family:var(--font-body); font-size:0.95rem;">
                    <button type="button" class="btn btn-primary" onclick="goToSurvey()">Go</button>
                </div>
                <p id="joinSurveyError" style="color:#f87171; margin-top:10px;"></p>
            </section>
        </div>
    </section>

    <script src="theme.js"></script>
    <script src="api.js"></script>
    <script>
        const surveyListEl = document.getElementById('surveyList');
        const latestShareEl = document.getElementById('latestShare');
        const signOutBtn = document.getElementById('signOutBtn');

        if (!isLoggedIn()){
            window.location.href = 'auth.html';
        }

        document.getElementById('navEmail').textContent = getEmail();

        function escapeHtml(str){
            const div = document.createElement('div');
            div.textContent = str == null ? '' : String(str);
            return div.innerHTML;
        }

        function copyShareLink(token, btnOrId){
            const btn = typeof btnOrId === 'string' ? document.getElementById(btnOrId) : btnOrId;
            const url = `${window.location.origin}${window.location.pathname.replace('dashboard.html','')}share.html?token=${token}`;
            const icon = btn.querySelector('i');

            function flash(success){
                if (icon){
                    const originalClass = icon.className;
                    icon.className = success ? 'fa-solid fa-check' : 'fa-solid fa-xmark';
                    btn.title = success ? 'Copied!' : 'Copy failed';
                    setTimeout(() => {
                        icon.className = originalClass;
                        btn.title = 'Copy share link';
                    }, 1500);
                } else {
                    const original = btn.textContent;
                    btn.textContent = success ? 'Copied!' : 'Copy failed';
                    setTimeout(() => { btn.textContent = original; }, 1500);
                }
            }

            navigator.clipboard.writeText(url).then(() => flash(true)).catch(() => flash(false));
        }
        window.copyShareLink = copyShareLink;

        async function deleteSurvey(surveyId, linkEl){
            const confirmed = window.confirm('Delete this survey? This also removes all its questions and responses. This cannot be undone.');
            if (!confirmed) return;

            const card = linkEl.closest('.inner-card');
            const originalText = linkEl.textContent;
            linkEl.textContent = 'Deleting…';

            try {
                const response = await apiFetch(`/surveys/${surveyId}`, { method: 'DELETE' });

                if (response.status === 403){
                    alert('You can only delete surveys you own.');
                    linkEl.textContent = originalText;
                    return;
                }
                if (response.status === 404){
                    alert('This survey no longer exists.');
                    if (card) card.remove();
                    return;
                }

                let data = {};
                try { data = await response.json(); } catch (e) { /* some DELETE endpoints return no body */ }

                if (!response.ok || (data && data.success === false)){
                    alert((data && data.message) || 'Could not delete this survey.');
                    linkEl.textContent = originalText;
                    return;
                }

                if (card) card.remove();

            } catch (err){
                if (err.message && err.message.includes('Unauthorized')) return;
                console.error('Failed to delete survey:', err);
                alert('Could not reach the server.');
                linkEl.textContent = originalText;
            }
        }
        window.deleteSurvey = deleteSurvey;

        function goToSurvey(){
            const input = document.getElementById('joinSurveyInput');
            const errorEl = document.getElementById('joinSurveyError');
            const raw = input.value.trim();
            errorEl.textContent = '';

            if (!raw){
                errorEl.textContent = 'Paste a survey link or code first.';
                return;
            }

            let token = raw;

            // Accept a full URL (e.g. https://.../share.html?token=ABCD1234)
            // or just "share.html?token=ABCD1234", or a bare token.
            const tokenMatch = raw.match(/[?&]token=([^&\s]+)/);
            if (tokenMatch){
                token = decodeURIComponent(tokenMatch[1]);
            }

            if (!token){
                errorEl.textContent = 'Could not find a survey code in that link.';
                return;
            }

            window.location.href = `share.html?token=${encodeURIComponent(token)}`;
        }
        window.goToSurvey = goToSurvey;

        document.getElementById('joinSurveyInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') goToSurvey();
        });

        function renderLatestShare(){
            let latestShare;
            try {
                latestShare = JSON.parse(localStorage.getItem('hexasurvey_latest_share'));
            } catch (error) {
                localStorage.removeItem('hexasurvey_latest_share');
                return;
            }

            if (!latestShare || !latestShare.token) return;

            const shareUrl = `${window.location.origin}${window.location.pathname.replace('dashboard.html', '')}share.html?token=${encodeURIComponent(latestShare.token)}`;
            latestShareEl.hidden = false;
            latestShareEl.innerHTML = `
                <h2>Share your survey</h2>
                <p>${escapeHtml(latestShare.title || 'Your new survey')} is ready to share.</p>
                <div class="share-row">
                    <code>${escapeHtml(shareUrl)}</code>
                    <button type="button" class="copy-btn" id="copyLatestShare">Copy link</button>
                    <a href="${escapeHtml(shareUrl)}" class="copy-btn">Open survey</a>
                </div>
            `;
            document.getElementById('copyLatestShare').addEventListener('click', function(){
                copyShareLink(latestShare.token, this);
            });
        }

        function renderSurveys(surveys){
            if (!surveys || surveys.length === 0){
                surveyListEl.innerHTML = '<p>You haven\'t created any surveys yet.</p>';
                return;
            }

            surveyListEl.innerHTML = surveys.map(s => {
                const isShareable = !!s.share_token;
                const shareUrl = isShareable
                    ? `${window.location.origin}${window.location.pathname.replace('dashboard.html','')}share.html?token=${escapeHtml(s.share_token)}`
                    : '';
                const copyIcon = isShareable
                    ? `<button type="button" class="copy-icon-btn" id="copyIcon-${s.id}" title="Copy share link" onclick="copyShareLink('${escapeHtml(s.share_token)}', 'copyIcon-${s.id}')"><i class="fa-solid fa-copy"></i></button>`
                    : '';
                const viewAnalyticsLink = isShareable
                    ? `<a href="analytics.html?id=${s.id}">View analytics</a>`
                    : '';

                return `
                    <div class="inner-card" style="margin-top:16px;">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <h3>${escapeHtml(s.title)}</h3>
                            ${copyIcon}
                        </div>
                        <p>${escapeHtml(s.description || '')}</p>
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
                            <span>${viewAnalyticsLink}</span>
                            <span>
                                <a href="create-survey.html?id=${s.id}" style="font-weight:700;">Edit survey</a>
                                &middot;
                                <a href="#" onclick="deleteSurvey(${s.id}, this); return false;" style="color:#f87171;">Delete</a>
                            </span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function loadSurveys(){
            try {
                const response = await apiFetch('/surveys/', { method: 'GET' });

                if (response.status === 403){
                    document.getElementById('creatorSurveysCard').hidden = true;
                    document.getElementById('respondentJoinCard').hidden = false;
                    return;
                }

                const data = await response.json();

                if (!response.ok || !data.success){
                    surveyListEl.innerHTML = `<p>Could not load surveys: ${escapeHtml(data.message || 'Unknown error')}</p>`;
                    return;
                }

                renderSurveys(data.data);

            } catch (err){
                if (err.message && err.message.includes('Unauthorized')) return;
                console.error('Failed to load surveys:', err);
                surveyListEl.innerHTML = '<p>Could not reach the server. Check that the backend URL in api.js is correct.</p>';
            }
        }

        signOutBtn.addEventListener('click', async (e) => {
            e.preventDefault();
            try {
                await apiFetch('/auth/logout', { method: 'POST' });
            } catch (err){
                console.error('Logout request failed:', err);
            } finally {
                clearToken();
                window.location.href = 'auth.html';
            }
        });

        renderLatestShare();
        loadSurveys();
    </script>
</body>
</html>
